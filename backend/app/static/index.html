<!DOCTYPE html>
<html>
<head>
  <title>SafeWatch AI Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    h1 {
      color: #38bdf8;
    }
    .alert {
      background: #1e293b;
      border-left: 5px solid red;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
    }
    img {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 10px;
    }
    .severity-HIGH { border-color: red; }
    .severity-MEDIUM { border-color: orange; }
    .severity-LOW { border-color: yellow; }
  </style>
</head>
<body>

<h1>🚨 SafeWatch AI Alerts</h1>
<div id="alerts"></div>

<script>
async function loadAlerts() {
  const res = await fetch("/alerts");
  const alerts = await res.json();

  const container = document.getElementById("alerts");
  container.innerHTML = "";

  if (alerts.length === 0) {
    container.innerHTML = "<p>No alerts yet.</p>";
    return;
  }

  alerts.reverse().forEach(alert => {
    const div = document.createElement("div");
    div.className = `alert severity-${alert.severity}`;
    div.innerHTML = `
      <h3>${alert.type.toUpperCase()}</h3>
      <p><b>Severity:</b> ${alert.severity}</p>
      <p><b>Confidence:</b> ${alert.confidence}</p>
      <p><b>Time:</b> ${alert.timestamp}</p>
      <img src="/alerts/${alert.id}/snapshot" />
    `;
    container.appendChild(div);
  });
}

loadAlerts();
setInterval(loadAlerts, 5000);
</script>

</body>
</html>
